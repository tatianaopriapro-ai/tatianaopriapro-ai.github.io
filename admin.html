<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Керування сайтом — Тетяна Опря</title>
<link rel="icon" href="favicon.ico">
<style>
:root{--paper:#faf7f1;--sand:#eae1d2;--teal-d:#22383e;--teal:#2f4a52;--gold:#c79d63;--gold-d:#86602f;--muted:#6d7a7c;--line:#ddd3c2}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--teal-d);background:var(--paper);display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
.b{padding:9px 16px;border:1px solid var(--teal-d);border-radius:999px;background:var(--teal-d);color:#fff;cursor:pointer;white-space:nowrap}
.b:hover{background:var(--teal)}
.b:disabled{opacity:.5;cursor:default}
.b.g{background:transparent;color:var(--teal-d)}
.b.g:hover{background:var(--sand)}
.b.gold{background:var(--gold);border-color:var(--gold);color:var(--teal-d)}
/* вхід */
#login{margin:auto;width:min(380px,calc(100% - 32px));padding:32px;background:#fff;border:1px solid var(--line);border-radius:10px}
#login h1{margin:0 0 6px;font-size:22px}
#login p{margin:0 0 18px;color:var(--muted)}
#login input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);margin-bottom:12px}
#login .b{width:100%}
#lerr{margin:12px 0 0;color:#8a3a1c;min-height:1.5em}
/* панель */
#bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
#bar strong{margin-right:6px}
#bar select{padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);max-width:100%}
#bar label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
#bar .sp{flex:1}
#status{padding:8px 16px;font-size:14px;background:var(--sand);border-bottom:1px solid var(--line)}
#status.ok{background:#e4efe6;color:#22503a}
#status.err{background:#f6e6dc;color:#7a3b1d}
#frame{flex:1;width:100%;border:0;background:#fff;min-height:0}
#tabs{display:flex;gap:6px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
#tabs button{flex:none;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer;white-space:nowrap;font-size:14px}
#tabs button:hover{background:var(--sand)}
#tabs button[aria-current="page"]{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
#tabs button.pr{border-color:var(--gold);color:var(--gold-d);font-weight:600}
#tabs button.pr[aria-current="page"]{background:var(--gold);color:var(--teal-d)}
#prices{flex:1;overflow:auto;padding:28px 16px 60px}
#prices>*{max-width:560px;margin-left:auto;margin-right:auto}
#prices h1{font-size:24px;margin-top:0;margin-bottom:6px}
#prices .pn{color:var(--muted);margin-top:0;margin-bottom:22px}
#pform label{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
#pform label span{flex:1}
#pform input{width:110px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;text-align:right}
#pform i{font-style:normal;color:var(--muted)}
#psave{display:block;margin-top:24px}
[hidden]{display:none!important}
@media (max-width:640px){#bar .sp{display:none}.b{padding:8px 12px}}
</style>
</head>
<body>

<form id="login" autocomplete="off">
  <h1>Керування сайтом</h1>
  <p>Введіть пароль адміністратора.</p>
  <input id="pw" type="password" placeholder="Пароль" required autocomplete="current-password" aria-label="Пароль">
  <button class="b" type="submit">Увійти</button>
  <p id="lerr" role="alert"></p>
</form>

<div id="bar" hidden>
  <select id="page" aria-label="Сторінка для редагування" hidden>
    <option value="index.html">Головна</option>
    <option value="magazyn.html">Первинна консультація</option>
    <option value="konsaltynh.html">Бізнес-консалтинг</option>
    <option value="biznes-z-rozumom.html">«Бізнес з розумом»</option>
    <option value="atmakhilinh.html">Атмахілінг</option>
    <option value="8-krokiv.html">«8 кроків»</option>
    <option value="oplata.html">Оплата і повернення</option>
    <option value="oferta.html">Публічна оферта</option>
    <option value="polityka.html">Політика конфіденційності</option>
    <option value="404.html">Сторінка «Не знайдено»</option>
  </select>
  <label><input id="showhidden" type="checkbox"> показати приховані блоки</label>
  <span class="sp"></span>
  <a class="b g" href="https://dash.cloudflare.com/?to=/:account/web-analytics" target="_blank" rel="noopener">Аналітика ↗</a>
  <a class="b g" id="view" href="index.html" target="_blank" rel="noopener">Відкрити сайт ↗</a>
  <button class="b g" id="undo" type="button" disabled>Скасувати зміни</button>
  <button class="b gold" id="save" type="button" disabled>Зберегти й опублікувати</button>
</div>
<nav id="tabs" aria-label="Сторінки сайту" hidden></nav>
<div id="status" role="status" hidden></div>
<section id="prices" hidden>
  <h1>Ціни</h1>
  <p class="pn">Ціна в євро. Після збереження вона зміниться на всіх сторінках сайту, у вікні заявки й у сумі оплати. Списання йде в гривні за курсом НБУ на день оплати.</p>
  <form id="pform" autocomplete="off"></form>
  <button class="b gold" id="psave" type="button">Зберегти ціни</button>
</section>
<iframe id="frame" title="Сторінка сайту для редагування" hidden></iframe>
<input id="file" type="file" accept="image/*" hidden>

<script>
(function(){
  var API = 'https://opria-forms.tatianaopria-pro.workers.dev/';
  var LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname); // локальний перегляд: без пароля й без збереження
  var $ = function(id){ return document.getElementById(id); };
  var frame = $('frame'), statusEl = $('status'), saveBtn = $('save'), undoBtn = $('undo'), pageSel = $('page');
  var pw = '', sha = '', path = '', dirty = false, uploads = [], targetImg = null, saving = false, changedWhileSaving = false;

  function say(text, kind){ statusEl.hidden = !text; statusEl.textContent = text || ''; statusEl.className = kind || ''; }
  function setDirty(v){ dirty = v; if (v && saving) changedWhileSaving = true; saveBtn.disabled = LOCAL || saving || !path; undoBtn.disabled = !v; }
  function api(body){
    body.pw = pw;
    return fetch(API, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ j.status = r.status; return j; }); });
  }
  function why(j){
    if (j.status === 401) return 'Неправильний пароль.';
    if (j.status === 409) return 'Сторінку тим часом змінили в іншому місці. Перезавантажте її і внесіть правки ще раз.';
    if (j.error === 'admin-off') return 'Адмінку ще не ввімкнено: у воркері бракує пароля або ключа GitHub.';
    if (j.detail === 'github 401' || j.detail === 'github 403' || j.detail === 'github 404') return 'Ключ GitHub не має права запису в репозиторій сайту. Напишіть розробнику.';
    return 'Не вдалося виконати дію. Спробуйте ще раз за хвилину.' + (j.status ? ' (код ' + j.status + (j.detail ? ', ' + j.detail : '') + ')' : '');
  }

  /* ── вкладки всіх сторінок сайту ── */
  var tabs = $('tabs');
  Array.prototype.forEach.call(pageSel.options, function(o){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = o.textContent; b.setAttribute('data-p', o.value);
    b.addEventListener('click', function(){
      if (o.value === path) return;
      if (dirty && !confirm('На цій сторінці є незбережені зміни. Перейти без збереження?')) return;
      pageSel.value = o.value; load(o.value);
    });
    tabs.appendChild(b);
  });
  /* ── ціни ── */
  var PRODUCTS = [
    ['602967', 'Первинна консультація, 60 хв'],
    ['618782', 'Цикл сеансів атмахілінгу, персональний'],
    ['695992', 'Грошовий потік — атмахілінг, група'],
    ['biz-diag', 'Діагностика бізнесу'],
    ['biz-cons', 'Бізнес-консультування'],
    ['biz-int', 'Інтеграція та супровід']
  ];
  var PRICE_PAGES = ['index.html', 'magazyn.html', 'konsaltynh.html', 'atmakhilinh.html', 'biznes-z-rozumom.html'];
  var pricesEl = $('prices'), pform = $('pform'), psave = $('psave'), pricesSha = '';
  PRODUCTS.forEach(function(pr){
    var l = document.createElement('label');
    l.innerHTML = '<span></span><input type="number" min="1" max="100000" step="1" inputmode="numeric" required><i>€</i>';
    l.firstChild.textContent = pr[1]; l.querySelector('input').name = pr[0];
    pform.appendChild(l);
  });
  var prTab = document.createElement('button'); prTab.type = 'button'; prTab.className = 'pr'; prTab.textContent = 'Ціни'; prTab.setAttribute('data-p', '#prices');
  tabs.insertBefore(prTab, tabs.firstChild);
  function inp(id){ return pform.querySelector('input[name="' + id + '"]'); }
  function fmt(n){ return String(n).replace(/\B(?=(\d{3})+$)/g, ' '); }
  function loadFile(p){
    return LOCAL
      ? fetch(p + '?t=' + Date.now(), {cache: 'no-store'}).then(function(r){ return r.text(); }).then(function(t){ return {ok: true, content: t, sha: ''}; })
      : api({kind: 'admin-load', path: p});
  }
  function openPrices(){
    if (dirty && !confirm('На цій сторінці є незбережені зміни. Перейти без збереження?')) return;
    path = ''; uploads = []; setDirty(false); markTab('#prices');
    frame.hidden = true; pricesEl.hidden = false; psave.disabled = true;
    say('Завантажую ціни…');
    loadFile('prices.json').then(function(j){
      if (!j.ok){ say(why(j), 'err'); return; }
      pricesSha = j.sha;
      var cur = JSON.parse(j.content);
      PRODUCTS.forEach(function(pr){ inp(pr[0]).value = cur[pr[0]] || ''; });
      psave.disabled = LOCAL;
      say(LOCAL ? 'Локальний перегляд: зміни не зберігаються.' : 'Змініть потрібні ціни й натисніть «Зберегти ціни».');
    }).catch(function(){ say('Немає зв\u2019язку із сервером.', 'err'); });
  }
  prTab.addEventListener('click', openPrices);
  /* підставляє нові ціни в текст сторінки: позначені місця, заголовок і дані для пошуковиків */
  function applyPrices(html, pr){
    PRODUCTS.forEach(function(x){
      var re = new RegExp('(<[^<>]*\\bdata-price="' + x[0] + '"[^<>]*>)[^<]*', 'g');
      html = html.replace(re, function(m, tag){ return tag + fmt(pr[x[0]]) + ' €'; });
    });
    var first = fmt(pr['602967']) + ' €';
    html = html.replace(/(<title>[^<]*хвилин, )[\d\s]+€/, function(m, a){ return a + first; });
    html = html.replace(/(property="og:title" content="[^"]*хвилин, )[\d\s]+€/, function(m, a){ return a + first; });
    var order = ['602967', 'biz-diag', 'biz-cons', 'biz-int', '618782', '695992'], k = 0;
    html = html.replace(/("@type": "Offer", "price": ")\d+(")/g, function(m, a, b){ var id = order[k++]; return id ? a + pr[id] + b : m; });
    var all = PRODUCTS.map(function(x){ return pr[x[0]]; });
    html = html.replace(/("priceRange": ")[^"]*(")/, function(m, a, b){ return a + Math.min.apply(null, all) + '–' + Math.max.apply(null, all) + ' EUR' + b; });
    return html;
  }
  psave.addEventListener('click', function(){
    if (!pform.reportValidity()) return;
    var pr = {};
    PRODUCTS.forEach(function(x){ pr[x[0]] = parseInt(inp(x[0]).value, 10); });
    psave.disabled = true; psave.textContent = 'Зберігаю…'; say('Зберігаю ціни… Це займає до пів хвилини.');
    var files = [{path: 'prices.json', content: JSON.stringify(pr, null, 2) + '\n', sha: pricesSha}];
    var chain = Promise.resolve();
    PRICE_PAGES.forEach(function(p){
      chain = chain.then(function(){ return loadFile(p); }).then(function(j){
        if (!j.ok) throw j;
        var next = applyPrices(j.content, pr);
        if (next !== j.content) files.push({path: p, content: next, sha: j.sha});
      });
    });
    chain.then(function(){ return api({kind: 'admin-save', files: files}); }).then(function(j){
      psave.disabled = false; psave.textContent = 'Зберегти ціни';
      if (!j.ok){ say(why(j), 'err'); return; }
      pricesSha = (j.shas && j.shas['prices.json']) || pricesSha;
      say(j.same ? 'Ціни не змінилися — зберігати нічого.' : 'Ціни збережено. На сайті й в оплаті вони оновляться приблизно за хвилину.', 'ok');
    }).catch(function(j){
      psave.disabled = false; psave.textContent = 'Зберегти ціни';
      say(j && j.status ? why(j) : 'Немає зв\u2019язку із сервером. Ціни не збережено.', 'err');
    });
  });

  function markTab(p){
    Array.prototype.forEach.call(tabs.children, function(b){
      if (b.getAttribute('data-p') === p){ b.setAttribute('aria-current', 'page'); b.scrollIntoView({block: 'nearest', inline: 'nearest'}); }
      else b.removeAttribute('aria-current');
    });
  }

  /* ── вхід ── */
  function enter(){
    $('login').hidden = true; $('bar').hidden = false; $('tabs').hidden = false; frame.hidden = false;
    load(pageSel.value);
  }
  $('login').addEventListener('submit', function(e){
    e.preventDefault();
    pw = $('pw').value;
    $('lerr').textContent = 'Перевіряю…';
    api({kind: 'admin-check'}).then(function(j){
      if (j.ok){ try { sessionStorage.setItem('adm', pw); } catch(_){} enter(); }
      else { $('lerr').textContent = why(j); }
    }).catch(function(){ $('lerr').textContent = 'Немає зв’язку із сервером.'; });
  });
  if (LOCAL) enter();
  else { try { pw = sessionStorage.getItem('adm') || ''; } catch(_){} if (pw) api({kind: 'admin-check'}).then(function(j){ if (j.ok) enter(); }); }

  /* ── завантаження сторінки в редактор ── */
  function load(p){
    path = p; uploads = []; setDirty(false); markTab(p); pricesEl.hidden = true; frame.hidden = false;
    $('view').href = p;
    say('Завантажую сторінку…');
    var get = LOCAL
      ? fetch(p + '?t=' + Date.now(), {cache: 'no-store'}).then(function(r){ return r.text(); }).then(function(t){ return {ok: true, content: t, sha: ''}; })
      : api({kind: 'admin-load', path: p});
    get.then(function(j){
      if (!j.ok){ say(why(j), 'err'); return; }
      sha = j.sha;
      var base = '<base id="__admbase" href="' + location.href.replace(/[^\/]*$/, '') + '">';
      var css = '<style id="__adm">.rv{opacity:1!important;transform:none!important}' +
        '[data-adm]{outline:1px dashed transparent;outline-offset:2px;cursor:text}' +
        '[data-adm]:hover{outline-color:#c79d63}[data-adm]:focus{outline:2px solid #c79d63;background:rgba(199,157,99,.12)}' +
        'img{cursor:pointer}img:hover{outline:3px solid #c79d63;outline-offset:-3px}' +
        'html.__admh [hidden]{display:block!important;outline:1px dotted #86602f}</style>';
      frame.onload = prepare;
      /* скрипти сторінки в редакторі вимикаємо зміною типу (а не «пісочницею» — у Safari та на телефонах
         вона блокувала й сам редактор); під час збереження типи повертаються */
      var off = j.content.replace(/<script\b([^>]*)>/gi, function(m, attrs){
        var t = /\btype\s*=\s*["']?([^"'\s>]+)/i.exec(attrs);
        if (t && !/^(module|text\/javascript|application\/javascript)$/i.test(t[1])) return m; // дані, не код
        var rest = t ? attrs.replace(/\btype\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/i, '') : attrs;
        return '<script type="adm/off" data-adm-s="' + (t ? t[1] : '1') + '"' + rest + '>';
      });
      frame.srcdoc = off.replace(/<head([^>]*)>/i, function(m){ return m + base + css; });
    }).catch(function(){ say('Немає зв’язку із сервером.', 'err'); });
  }

  function prepare(){
    var doc = frame.contentDocument;
    var SEL = 'h1,h2,h3,h4,h5,p,li,blockquote,figcaption,summary,dt,dd,td,th,cite,a,button,span,div,b,strong,em,small';
    Array.prototype.forEach.call(doc.body.querySelectorAll(SEL), function(el){
      if (el.closest('[contenteditable],script,style,svg,noscript,form,iframe') || el.hasAttribute('data-price')) return;
      var hasText = Array.prototype.some.call(el.childNodes, function(n){ return n.nodeType === 3 && n.nodeValue.trim(); });
      if (!hasText) return;
      el.setAttribute('contenteditable', 'true'); el.setAttribute('data-adm', '1'); el.setAttribute('spellcheck', 'false');
    });
    ['input', 'cut', 'drop', 'keyup'].forEach(function(ev){ doc.addEventListener(ev, function(e){
      if (ev === 'keyup' && !(e.key === 'Backspace' || e.key === 'Delete')) return;
      setDirty(true);
    }); });
    doc.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey) e.preventDefault(); });
    doc.addEventListener('paste', function(e){
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\s*\n\s*/g, ' ');
      doc.execCommand('insertText', false, t);
    });
    doc.addEventListener('click', function(e){
      var img = e.target.closest && e.target.closest('img');
      if (img){ e.preventDefault(); targetImg = img; $('file').value = ''; $('file').click(); return; }
      if (e.target.closest && e.target.closest('a,button,summary')) e.preventDefault();
    }, true);
    doc.addEventListener('submit', function(e){ e.preventDefault(); }, true);
    doc.documentElement.classList.toggle('__admh', $('showhidden').checked);
    say(LOCAL ? 'Локальний перегляд: зміни не зберігаються.' : 'Клацніть на текст, щоб змінити його, або на фото, щоб замінити. Потім натисніть «Зберегти й опублікувати».');
  }

  $('showhidden').addEventListener('change', function(){
    if (frame.contentDocument) frame.contentDocument.documentElement.classList.toggle('__admh', this.checked);
  });

  /* ── заміна фото: зменшуємо до 1800 px і стискаємо у WebP ── */
  $('file').addEventListener('change', function(){
    var f = this.files[0], img = targetImg;
    if (!f || !img) return;
    say('Готую фото…');
    createImageBitmap(f).then(function(bmp){
      var k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
      var c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      c.toBlob(function(blob){
        var rd = new FileReader();
        rd.onload = function(){
          var p = 'img/u' + Date.now().toString(36) + '.webp';
          uploads.push({path: p, b64: String(rd.result).split(',')[1]});
          img.setAttribute('data-adm-src', p);
          img.removeAttribute('srcset');
          if (img.hasAttribute('width') && img.hasAttribute('height')){ img.setAttribute('width', c.width); img.setAttribute('height', c.height); }
          img.src = URL.createObjectURL(blob);
          setDirty(true);
          say('Фото замінено. Натисніть «Зберегти й опублікувати», щоб воно з’явилося на сайті.');
        };
        rd.readAsDataURL(blob);
      }, 'image/webp', 0.85);
    }).catch(function(){ say('Цей файл не вдалося відкрити як зображення.', 'err'); });
  });

  /* ── збереження ── */
  function serialize(){
    var d = frame.contentDocument.documentElement.cloneNode(true);
    d.classList.remove('__admh'); if (!d.getAttribute('class')) d.removeAttribute('class');
    Array.prototype.forEach.call(d.querySelectorAll('#__adm,#__admbase'), function(e){ e.remove(); });
    Array.prototype.forEach.call(d.querySelectorAll('[data-adm]'), function(e){
      e.removeAttribute('contenteditable'); e.removeAttribute('data-adm'); e.removeAttribute('spellcheck');
    });
    Array.prototype.forEach.call(d.querySelectorAll('script[data-adm-s]'), function(e){
      var t = e.getAttribute('data-adm-s');
      if (t === '1') e.removeAttribute('type'); else e.setAttribute('type', t);
      e.removeAttribute('data-adm-s');
    });
    var used = {};
    Array.prototype.forEach.call(d.querySelectorAll('img[data-adm-src]'), function(e){
      var p = e.getAttribute('data-adm-src'); used[p] = 1; e.setAttribute('src', p); e.removeAttribute('data-adm-src');
    });
    return {html: '<!DOCTYPE html>\n' + d.outerHTML.replace(/\s+<\/body>/, '\n</body>') + '\n', images: uploads.filter(function(u){ return used[u.path]; })};
  }
  saveBtn.addEventListener('click', function(){
    var out = serialize();
    if (saving) return;
    saving = true; saveBtn.disabled = true; saveBtn.textContent = 'Зберігаю…'; say('Зберігаю… Це займає кілька секунд.');
    var done = function(){ saving = false; saveBtn.textContent = 'Зберегти й опублікувати'; };
    api({kind: 'admin-save', path: path, sha: sha, content: out.html, images: out.images}).then(function(j){
      done();
      if (!j.ok){ saveBtn.disabled = false; say(why(j), 'err'); return; }
      sha = j.sha; uploads = []; setDirty(changedWhileSaving); changedWhileSaving = false;
      say(j.same ? 'Змін на цій сторінці немає — зберігати нічого.' : 'Збережено. Зміни з’являться на сайті приблизно за хвилину.', 'ok');
    }).catch(function(){ done(); saveBtn.disabled = false; say('Немає зв’язку із сервером. Зміни не збережено.', 'err'); });
  });
  undoBtn.addEventListener('click', function(){ if (confirm('Скасувати всі незбережені зміни на цій сторінці?')) load(path); });
  pageSel.addEventListener('change', function(){
    if (dirty && !confirm('На цій сторінці є незбережені зміни. Перейти без збереження?')){ pageSel.value = path; return; }
    load(pageSel.value);
  });
  window.addEventListener('beforeunload', function(e){ if (dirty){ e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
